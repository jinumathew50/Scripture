<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Book shape -->
  <rect x="15" y="20" width="70" height="60" rx="5" fill="url(#grad1)" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Cross on cover -->
  <path d="M50 35 L50 55 M42 45 L58 45" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pages -->
  <path d="M20 25 L80 25 L80 75 L20 75 Z" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="20" y1="35" x2="80" y2="35" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="20" y1="45" x2="80" y2="45" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="20" y1="55" x2="80" y2="55" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="20" y1="65" x2="80" y2="65" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Glow effect -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.5"/>
</svg>
