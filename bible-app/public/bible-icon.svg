<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Book cover -->
  <rect x="20" y="15" width="60" height="70" rx="3" fill="url(#bookGradient)" stroke="#3730a3" stroke-width="2"/>
  
  <!-- Book pages -->
  <path d="M 25 20 L 75 20 L 75 80 L 25 80 Z" fill="#f5f5f5" opacity="0.3"/>
  <line x1="30" y1="20" x2="30" y2="80" stroke="#3730a3" stroke-width="1.5"/>
  
  <!-- Cross on cover -->
  <path d="M 50 25 L 50 45 M 43 32 L 57 32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Book spine -->
  <rect x="20" y="15" width="5" height="70" rx="2" fill="#3730a3"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="55" r="8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M 50 50 L 50 55 L 54 58" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
