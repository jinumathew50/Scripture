name: bible_app
  go_router: ^12.1.0
description: A Bible reading and listening app with dramatized audio powered by Supabase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Routing
  go_router: ^12.1.0
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  bloc: ^8.1.2
  
  # Supabase
  supabase_flutter: ^2.3.0
  
  # Audio
  just_audio: ^0.9.34
  audio_service: ^0.18.12
  audio_session: ^0.1.18
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  
  # HTTP
  http: ^1.1.0
  dio: ^5.3.2
  
  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  
  # Utils
  intl: ^0.18.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  flutter_local_notifications: ^16.3.0
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1
  mockito: ^5.4.3
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
  
  fonts:
    - family: BibleSerif
      fonts:
        - asset: assets/fonts/BibleSerif-Regular.ttf
        - asset: assets/fonts/BibleSerif-Bold.ttf
          weight: 700
